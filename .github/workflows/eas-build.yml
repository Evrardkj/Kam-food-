name: Cam Food APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Cam Food Android
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Installer Expo et EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dependances
        run: npm install

      - name: Initialiser le projet EAS
        run: eas init --force --non-interactive

      - name: Construire l'APK
        run: eas build --platform android --profile preview --non-interactive --wait
